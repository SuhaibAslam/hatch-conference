name: Deploy workshop site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'site/**'
      - 'workshop/**'
      - 'skills/**'
      - 'tool-setup/**'
      - 'references/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          node site/build-content.js
          mkdir -p _site/content
          cp site/index.html site/styles.css site/app.js site/content.generated.js _site/
          cp -R workshop skills tool-setup references _site/content/
          cp README.md AGENTS.md LICENSE _site/content/
          touch _site/.nojekyll
          test -f _site/content.generated.js
          test -f _site/content/workshop/00-start-here.md
          test -f _site/content/workshop/04-encode/template--agent-skill.md
          test -f _site/content/workshop/05-evaluate/comparison-desk.html
          test -f _site/content/workshop/05-evaluate/fallback-comparison-desk.html
          test -f _site/content/workshop/05-evaluate/prompt--trial-assistant.md
          test -f _site/content/skills/run-skill-trial/SKILL.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
